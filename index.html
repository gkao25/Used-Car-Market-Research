<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 3 Interactive Visualization</title>
    <link rel="stylesheet" href="style.css" />
    <script src="global.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>Used Car Market Research</h1>
      <h2>Market Research Group</h2>
      <p class="team-members">
        Members:
        <a
          href="https://github.com/gkao25"
          target="_blank"
          rel="noopener noreferrer"
          >Gloria Kao</a
        >,
        <a
          href="https://github.com/neerajaupasani"
          target="_blank"
          rel="noopener noreferrer"
          >Neeraja Upasani</a
        >,
        <a
          href="https://github.com/xiaosiqaq-cjdl"
          target="_blank"
          rel="noopener noreferrer"
          >Lucia Si</a
        >,
        <a
          href="https://github.com/benly03"
          target="_blank"
          rel="noopener noreferrer"
          >Benjamin Ly</a
        >
      </p>
    </header>

    <main>
      <h2>What factors affect the price of used cars in India?</h2>
      
      <div id="sliders">
        <label> <!--show Manufacturing Year until: -->
          <em>Manufacturing Year:</em>
          <input type="range" id="commit-progress" min="2010" max="2023" value="2023">
          <time id="selected-year"></time>
        </label>
        
        <label> <!--show KM driven until: -->
          <em>Number of kilometers driven:</em>
          <input type="range" id="commit-progress" min="1207" max="124716" value="124716">
          <time id="selected-km"></time>
        </label>

        <label> <!--show Num of imperfections until: -->
          <em>Number of imperfections:</em>
          <input type="range" id="commit-progress" min="0" max="43" value="43">
          <time id="selected-imperfections"></time>
        </label>

        <fieldset id="transmission-filter">
          <legend><em>Transmission Type:</em></legend>
          <label>
            <input type="checkbox" name="transmission" value="Manual" checked>
            Manual
          </label>

          <label>
            <input type="checkbox" name="transmission" value="Automatic" checked>
            Automatic
          </label>
        </fieldset>
      </div>

      <figure class="line-container">
        <svg
          id="chart"
          viewBox="0 0 900 500"
          role="img"
          aria-label="Beeswarm chart showing price points of used cars in India"
          align="center"
        ></svg>
        <aside class="legend-panel">
          <div id="legend"></div>
        </aside>
        <figcaption>
          Price points for used cars in India from Cars24, filterable by using
          sliders on the right. Price was converted from Indian rupees into USD.
        </figcaption>
      </figure>

      <section>
        <h3>Writeup</h3>
        <p>Writeup goes here...</p>
      </section>
    </main>
  </body>
</html>
